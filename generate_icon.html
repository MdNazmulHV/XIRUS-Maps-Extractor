<!DOCTYPE html>
<html>
<head><title>XIRUS Icon Forge</title></head>
<body style="background: #0a0a0c; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif;">
  <h2 style="color: #00f2fe; letter-spacing: 2px;">XIRUS ICON FORGE</h2>
  <canvas id="iconCanvas" width="128" height="128" style="border: 1px solid #333; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0,242,254,0.2);"></canvas>
  <button onclick="downloadIcon()" style="padding: 12px 24px; background: linear-gradient(135deg, #4facfe, #00f2fe); color: black; border: none; font-weight: 800; font-size: 14px; cursor: pointer; border-radius: 8px;">Download icon.png</button>
  
  <script>
    const ctx = document.getElementById('iconCanvas').getContext('2d');
    ctx.fillStyle = 'rgba(10, 10, 12, 0)'; // Fully transparent background
    ctx.fillRect(0, 0, 128, 128);
    
    // Draw glowing futuristic X
    ctx.shadowColor = '#00f2fe';
    ctx.shadowBlur = 12;
    ctx.strokeStyle = '#00f2fe';
    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    
    ctx.beginPath();
    ctx.moveTo(32, 32); ctx.lineTo(96, 96);
    ctx.moveTo(96, 32); ctx.lineTo(32, 96);
    ctx.stroke();

    function downloadIcon() {
      const link = document.createElement('a');
      link.download = 'icon.png';
      link.href = document.getElementById('iconCanvas').toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
