name: CI Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Manifest File
        run: |
          node -e 'const fs = require("fs"); const m = JSON.parse(fs.readFileSync("manifest.json")); console.log("Manifest V3 Version:", m.manifest_version);'
